<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> 
        :root{
            --bg:#0f1419;
            --card:#1a2332;
            --muted:#7c8894;
            --accent:#3b82f6;
            --glass: rgba(255,255,255,0.04);
            --text-primary:#f0f4f8;
            --text-secondary:#cbd5e1;
        }
        html,body{height:100%;font-size:14px;font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;font-weight:500}
        body{background:linear-gradient(180deg,var(--bg),#0a0e14);color:var(--text-primary);margin:0}
        .app-card{background:linear-gradient(135deg,var(--card),#141d2a);box-shadow:0 8px 24px rgba(0,0,0,0.8);border:1px solid rgba(59,130,246,0.1)}
        .muted{color:var(--muted)}
        .tab-btn{padding:10px 16px;font-size:13px;font-weight:600;border-radius:12px;background:transparent;color:var(--muted);border:1px solid transparent;transition:all 0.2s}
        .tab-btn:hover{color:var(--text-primary);background:rgba(59,130,246,0.1);transform:translateY(-2px)}
        .tab-btn.active{background:linear-gradient(135deg, rgba(59,130,246,0.25), rgba(59,130,246,0.1));color:#3b82f6;border-color:rgba(59,130,246,0.4);box-shadow:0 4px 12px rgba(59,130,246,0.15)}
        .coin{width:96px;height:96px;perspective:1000px}
        .coin-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1s}
        .coin-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:20px}
        .coin-front{background:linear-gradient(180deg,#fff,#f1f5f9);color:#0b1220}
        .coin-back{background:linear-gradient(180deg,#f8fafc,#e6eef8);color:#0b1220;transform:rotateY(180deg)}
        .coin.flipY .coin-inner{transform:rotateY(720deg)}

        /* responsive tweaks */
        .container{max-width:1200px;padding:16px;margin:0 auto}
        #onlineUsers{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
        .online-card{min-width:80px;width:80px;flex:0 0 auto}
        h1,h2,h3,h4,h5,h6{line-height:1.2;margin:12px 0;font-weight:700;color:var(--text-primary)}
        label{font-size:13px;font-weight:600;color:var(--text-secondary)}
        input,textarea,select{font-size:14px!important;background:#0a0e14;color:#ffffff;border:1px solid rgba(59,130,246,0.2);border-radius:8px;padding:8px 12px}
        input::placeholder{color:#7c8894}
        input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(59,130,246,0.5);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}

        .leaderboard-table-container{width:100%;overflow:hidden;margin-top:0.5rem;}
        .leaderboard-table-container::-webkit-scrollbar{display:none}
        .leaderboard-table-container{-ms-overflow-style:none;scrollbar-width:none}
        #leaderboardTable{width:100%;border-collapse:collapse;table-layout:fixed}
        #leaderboardTable th,#leaderboardTable td{padding:0.75rem 0.5rem;text-align:right;border-bottom:1px solid rgba(59,130,246,0.15);font-size:1.8rem;line-height:1.1;font-weight:600}
        #leaderboardTable th:first-child,#leaderboardTable td:first-child{text-align:left;}
        #leaderboardTable th{font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;word-break:break-word}
        #leaderboardTable tbody tr:hover{background:rgba(59,130,246,0.08);}
        #leaderboardTable tfoot td{font-weight:700;border-top:2px solid rgba(59,130,246,0.2);color:var(--text-primary)}
        #leaderboardTable td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        #leaderboardTable td:first-child{white-space:normal}
        .leaderboard-decimal{font-size:30%;font-weight:600;vertical-align:baseline}
        @media (max-width: 720px){
            #leaderboardTable th,#leaderboardTable td{padding:0.5rem 0.2rem;font-size:0.85rem}
        }

        .table-ellipse{background:linear-gradient(180deg,#0f2c1f,#0a1f15);border:2px solid rgba(59,130,246,0.2);border-radius:9999px}

        .mobile-shell{max-width:420px;margin:0 auto}
        .glass-panel{background:linear-gradient(135deg, rgba(15,23,36,0.96), rgba(30,41,59,0.88));border:1px solid rgba(148,163,184,0.18);box-shadow:0 18px 50px rgba(15,23,42,0.35)}
        .metric-card{backdrop-filter:blur(8px);background:linear-gradient(135deg, rgba(59,130,246,0.16), rgba(15,23,42,0.2));border:1px solid rgba(148,163,184,0.08)}
        .segmented{display:inline-flex;background:rgba(15,23,42,0.8);padding:4px;border-radius:999px;border:1px solid rgba(148,163,184,0.15)}
        .segmented button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:all .2s}
        .segmented button.active{background:linear-gradient(135deg,#3b82f6,#60a5fa);color:white;box-shadow:0 8px 18px rgba(59,130,246,0.32)}
        @media (max-width: 720px){
            .container{padding:12px 10px 24px}
            .app-card{border-radius:16px}
            .tab-btn{padding:8px 10px;font-size:11px}
            #leaderboardTable th,#leaderboardTable td{padding:0.5rem 0.2rem;font-size:0.82rem}
            .mobile-shell{max-width:100%}
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- 登录/注册模态框 -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="app-card rounded-lg p-6 w-96">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold" id="authTitle">登录</h2>
                <button onclick="toggleAuthModal('login')" class="text-gray-400 hover:text-gray-300">&times;</button>
            </div>
            <div id="authForm">
                <!-- 登录表单 -->
                <div id="loginForm">
                    <div class="mb-4">
                        <label class="block text-gray-700 mb-2">用户名</label>
                        <input type="text" id="loginUsername" class="w-full px-3 py-2 border rounded">
                    </div>
                    <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">登录</button>
                    <p class="mt-2 text-sm">没有账号？<a onclick="toggleAuthModal('register')" class="text-blue-500">注册</a></p>
                </div>
                
                <!-- 注册表单 -->
                <div id="registerForm" class="hidden">
                    <div class="mb-4">
                        <label class="block muted mb-2">用户名</label>
                        <input type="text" id="regUsername" class="w-full px-3 py-2 border rounded">
                    </div>
                    <div class="mb-4">
                            <label class="block muted mb-2">头像（请选择一个表情，唯一）</label>
                            <div id="avatarPicker" class="flex flex-wrap gap-2 p-2 border rounded bg-gray-100 max-h-40 overflow-y-auto"></div>
                            <input type="hidden" id="regAvatar" value="default_avatar.png">
                        </div>
                    <button onclick="register()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">注册</button>
                    <p class="mt-2 text-sm">已有账号？<a onclick="toggleAuthModal('login')" class="text-blue-500">登录</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" class="hidden container">
        <!-- Top bar -->
        <header class="flex items-center justify-between py-2 mb-3">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center bg-gradient-to-br from-purple-600 to-indigo-500 text-white font-bold shadow-lg text-sm">R</div>
                <div>
                    <div class="text-base font-semibold">Accounting</div>
                    <div class="text-xs muted"></div>
                </div>
            </div>

            <div class="flex-1 mx-4 hidden md:block">
                <div class="w-full bg-[rgba(255,255,255,0.03)] rounded-lg py-1 px-3 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35"/></svg>
                    <input placeholder="Search players or sessions" class="w-full bg-transparent outline-none text-xs muted">
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div id="currentUserContainer" class="flex items-center gap-2">
                    <div id="currentAvatar" class="w-8 h-8 rounded-full flex items-center justify-center bg-[rgba(255,255,255,0.03)] text-xs"></div>
                    <div>
                        <div id="currentUser" class="text-xs font-medium"></div>
                        <div class="text-xs muted">online</div>
                    </div>
                    <button id="changeAvatarBtn" onclick="openAvatarModal()" class="text-xs px-2 py-1 rounded hidden">Change</button>
                </div>
                <button onclick="logout()" class="px-3 py-1 text-sm rounded bg-gradient-to-br from-red-500 to-pink-500 text-white shadow-sm">退出</button>
            </div>
        </header>

        <!-- Pill Tab导航 -->
        <nav class="mb-6">
            <div class="flex flex-wrap gap-2">
                <button onclick="switchTab('status')" class="tab-btn">Status</button>
                <button onclick="switchTab('points')" class="tab-btn">Points</button>
                <button onclick="switchTab('leaderboard')" class="tab-btn active">Leaderboard</button>
                <button onclick="switchTab('seats')" class="tab-btn">Seats</button>
                <button id="adminTabBtn" onclick="switchTab('admin')" class="tab-btn hidden">Admin</button>
            </div>
        </nav>

        <!-- Tab内容 -->
        <div class="app-card rounded-lg p-6 min-h-[500px]">
            <!-- Status Tab -->
            <div id="statusTab" class="tab-content hidden">
                <h2 class="text-base font-bold mb-3">在线用户</h2>
                <div id="onlineUsers" class="grid grid-cols-4 gap-3"></div>
                <h3 class="text-sm font-bold mt-4 mb-2">用户行为日志</h3>
                <div id="activityLog" class="border rounded p-2 h-48 overflow-y-auto text-xs"></div>
                <div class="mt-4 mobile-shell">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="text-sm font-bold">Buy-in Log</h3>
                        <span class="text-[10px] muted">筹码比例: <span id="statusChipRatioLabel">1</span></span>
                    </div>
                    <div id="buyinLogList" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
                </div>
            </div>

            <!-- Points Tab -->
            <div id="pointsTab" class="tab-content hidden">
                <h2 class="text-base font-bold mb-3">记分管理</h2>
                    <div class="mb-3">
                        <label class="block muted mb-1 text-xs">选择用户</label>
                        <div id="pointsUserButtons" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div class="mb-3">
                        <label class="block muted mb-1 text-xs">Buy In / Cash Out</label>
                        <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
                            <input type="text" inputmode="decimal" id="pointsAmount" placeholder="金额" class="px-2 py-1 border rounded w-full sm:w-32 text-sm">
                            <div class="segmented">
                                <button type="button" class="active" data-mode="amount">金额</button>
                                <button type="button" data-mode="chips">筹码</button>
                            </div>
                            <button onclick="performPointsAction('buy_in')" class="bg-green-500 text-white px-3 py-1 text-sm rounded">Buy In</button>
                            <button onclick="performPointsAction('cash_out')" class="bg-red-500 text-white px-3 py-1 text-sm rounded">Cash Out</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="block muted mb-1 text-xs">Set Current</label>
                        <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
                            <input type="text" inputmode="decimal" id="setCurrentAmount" placeholder="金额" class="px-2 py-1 border rounded w-full sm:w-32 text-sm">
                            <div class="segmented">
                                <button type="button" class="active" data-mode="set-current-amount">金额</button>
                                <button type="button" data-mode="set-current-chips">筹码</button>
                            </div>
                            <button onclick="performPointsAction('set_current', true)" class="bg-blue-500 text-white px-3 py-1 text-sm rounded">Set Current</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="block muted mb-1 text-xs">Win / Loss</label>
                        <div class="flex flex-col sm:flex-row gap-2 mb-2 sm:items-center">
                            <input type="text" inputmode="decimal" id="wlAmount" placeholder="金额" class="px-2 py-1 border rounded w-full sm:w-32 text-sm">
                            <div id="targetUserButtons" class="flex flex-wrap gap-2"></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="performWinLoss('win')" class="bg-green-600 text-white px-3 py-1 text-sm rounded">Win</button>
                            <button onclick="performWinLoss('loss')" class="bg-red-600 text-white px-3 py-1 text-sm rounded">Loss</button>
                        </div>
                    </div>

                <!-- 管理员控制面板 -->
                <div class="mb-3 hidden">
                        <label class="block muted mb-2">管理员控制</label>
                        <button onclick="createNewSession()" class="bg-green-500 text-white px-3 py-1 text-sm rounded hover:bg-green-600 mr-2">新建游戏会话</button>
                        <button onclick="refreshAllData()" class="bg-yellow-500 text-white px-3 py-1 text-sm rounded hover:bg-yellow-600 mr-2">刷新数据</button>
                        <button id="manageUsersBtn" onclick="openManageUsers()" class="bg-red-500 text-white px-3 py-1 text-sm rounded hover:bg-red-600 mr-2">管理用户</button>
                        <button onclick="resetAllData()" class="bg-red-700 text-white px-3 py-1 text-sm rounded hover:bg-red-800">⚠️ 清空所有数据</button>
                    </div>
            </div>

            <!-- Leaderboard Tab -->
            <div id="leaderboardTab" class="tab-content">
                <h2 class="text-base font-bold mb-3">排行榜</h2>
                <div class="mb-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                    <div class="flex flex-wrap gap-2">
                        <button onclick="loadLeaderboard()" class="bg-blue-500 text-white px-3 py-1 text-sm rounded hover:bg-blue-600">🔄 Refresh</button>
                        <button onclick="rebalanceScores()" class="bg-green-500 text-white px-3 py-1 text-sm rounded hover:bg-green-600">重新平衡</button>
                        <button onclick="revertRebalance()" class="bg-red-500 text-white px-3 py-1 text-sm rounded hover:bg-red-600">撤销平衡</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="totalWinLoss" class="font-bold text-sm"></span>
                        <div class="segmented ml-2" id="leaderboardDisplayMode">
                            <button type="button" class="active" data-display="amount">金额</button>
                            <button type="button" data-display="chips">筹码</button>
                        </div>
                    </div>
                </div>

                <div class="leaderboard-table-container">
                    <table id="leaderboardTable" class="app-card rounded-lg bg-[rgba(15,23,36,0.95)]">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Buy-in</th>
                                <th>Total</th>
                                <th>Win/Loss</th>
                                <th>Final</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                        <tfoot>
                            <tr>
                                <td>Total</td>
                                <td id="totalBuyin">-</td>
                                <td id="totalCurrent">-</td>
                                <td id="totalWinLossValue">-</td>
                                <td id="totalFinalValue">-</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Finals Tab: ownership percentages and final results -->
            <div id="finalsTab" class="tab-content hidden">
                <h2 class="text-base font-bold mb-3">Final Results (按持股比例计算)</h2>
                <div class="mb-3 flex gap-2 items-center">
                    <button onclick="loadFinalResults()" class="bg-blue-500 text-white px-3 py-1 text-sm rounded hover:bg-blue-600">🔄 Refresh</button>
                    <button onclick="applyEqualSplit()" class="bg-gray-500 text-white px-3 py-1 text-sm rounded hover:bg-gray-600">均分</button>
                </div>

                <div class="leaderboard-table-container">
                    <table id="finalsTable" class="app-card rounded-lg bg-[rgba(15,23,36,0.95)]">
                        <thead id="finalsThead"></thead>
                        <tbody id="finalsTbody"></tbody>
                        <tfoot>
                            <tr>
                                <td>Total Final</td>
                                <td id="finalsTotalLabel" colspan="100">-</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Trends Tab -->
            <div id="trendsTab" class="tab-content hidden">
                <h2 class="text-base font-bold mb-3">趋势图</h2>
                <div style="position:relative;width:100%;height:auto;min-height:300px">
                    <canvas id="trendsChart" style="max-height:600px"></canvas>
                </div>
            </div>

            <!-- Seats Tab -->
            <div id="seatsTab" class="tab-content hidden">
                <h2 class="text-base font-bold mb-3">座位分配</h2>
                <div class="mb-3 flex gap-2 items-center">
                    <button onclick="generateSeats()" id="generateSeatsBtn" class="bg-blue-500 text-white px-3 py-1 text-sm rounded hover:bg-blue-600 hidden">生成座位</button>
                    <button onclick="refreshSeats()" class="bg-gray-500 text-white px-3 py-1 text-sm rounded hover:bg-gray-600">刷新座位</button>
                    <button onclick="generateSeats()" id="redrawSeatsBtn" class="bg-purple-600 text-white px-3 py-1 text-sm rounded hidden">Redraw Seats</button>
                </div>

                <!-- Table container: moved down and responsive -->
                <div class="relative w-full flex justify-center items-center mt-12">
                    <!-- 椭圆桌子: width auto-fits, keeps 2:1 aspect ratio -->
                    <div id="tableEllipse" class="rounded-full table-ellipse relative" style="width: min(90vw, 600px); aspect-ratio: 2 / 1; padding-top:28px;">
                        <!-- 座位将动态生成 -->
                        <div id="seatsContainer" class="absolute inset-0 pointer-events-none"></div>
                    </div>
                </div>
            </div>

            <!-- Tournament Tab -->
            <div id="tournamentTab" class="tab-content hidden">
                <!-- Tournament Display Section -->
                <div class="mb-4 p-6 bg-gradient-to-b from-[rgba(139,92,246,0.2)] to-[rgba(59,130,246,0.2)] rounded-lg border border-[rgba(139,92,246,0.3)]">
                    <div class="flex justify-between items-center mb-4">
                        <div class="text-2xl font-bold text-purple-300">Tournament</div>
                        <button id="tournamentEditBtn" onclick="toggleTournamentEditMode()" class="bg-blue-600 text-white px-4 py-2 text-sm font-bold rounded hover:bg-blue-700">✏️ Edit</button>
                    </div>
                    
                    <!-- Display Mode (Default) -->
                    <div id="tournamentDisplayMode" class="space-y-4">
                        <!-- Level & Time Control -->
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-[rgba(0,0,0,0.3)] p-4 rounded text-center">
                                <div class="text-xs muted mb-2">Level</div>
                                <div id="displayLevel" class="text-3xl font-bold text-blue-400">1</div>
                            </div>
                            <div class="bg-[rgba(0,0,0,0.3)] p-4 rounded text-center">
                                <div class="text-xs muted mb-2">Time</div>
                                <div id="displayTime" class="text-2xl font-bold text-orange-400">15:00</div>
                            </div>
                        </div>
                        
                        <!-- Countdown Display -->
                        <div class="bg-[rgba(0,0,0,0.5)] p-4 rounded text-center">
                            <div class="text-xs muted mb-2">Time Left</div>
                            <div id="levelCountdown" class="text-5xl font-bold text-green-400">00:00</div>
                        </div>
                        
                        <!-- Current Blinds Display -->
                        <div class="mb-2 p-3 bg-[rgba(0,0,0,0.2)] rounded text-center">
                            <label class="text-xs muted mb-2 block font-bold">Current Blinds</label>
                            <div id="displayCurrentBlinds" class="text-3xl font-bold text-yellow-300">1 | 2 (0)</div>
                        </div>

                        <!-- Next Blinds Display -->
                        <div class="p-3 bg-[rgba(0,0,0,0.2)] rounded text-center">
                            <label class="text-xs muted mb-2 block font-bold">Next Blinds</label>
                            <div id="displayNextBlinds" class="text-2xl font-bold text-gray-300">2 | 4 (0)</div>
                        </div>
                    </div>

                    <!-- Edit Mode -->
                    <div id="tournamentEditMode" class="space-y-4 hidden">
                        <!-- Level & Time Control -->
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-[rgba(0,0,0,0.3)] p-4 rounded">
                                <label class="text-xs muted mb-2 block">Level</label>
                                <input type="number" id="editLevel" min="1" value="1" class="w-full px-2 py-2 border rounded text-center text-lg font-bold">
                            </div>
                            <div class="bg-[rgba(0,0,0,0.3)] p-4 rounded">
                                <label class="text-xs muted mb-2 block">Time (分钟)</label>
                                <input type="number" id="editTime" min="1" value="15" class="w-full px-2 py-2 border rounded text-center text-lg font-bold">
                            </div>
                        </div>
                        
                        <!-- Current Blinds Edit -->
                        <div class="p-3 bg-[rgba(0,0,0,0.2)] rounded">
                            <label class="text-xs muted mb-2 block font-bold">Current Blinds</label>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="text-xs muted mb-1 block">SB</label>
                                    <input type="number" id="editCurrentSB" step="0.5" min="0" value="1" class="w-full px-2 py-2 border rounded text-center text-sm font-bold">
                                </div>
                                <div>
                                    <label class="text-xs muted mb-1 block">BB</label>
                                    <input type="number" id="editCurrentBB" step="0.5" min="0" value="2" class="w-full px-2 py-2 border rounded text-center text-sm font-bold">
                                </div>
                                <div>
                                    <label class="text-xs muted mb-1 block">Ante</label>
                                    <input type="number" id="editCurrentAnte" step="0.5" min="0" value="0" class="w-full px-2 py-2 border rounded text-center text-sm font-bold">
                                </div>
                            </div>
                        </div>

                        <!-- Next Blinds Edit -->
                        <div class="p-3 bg-[rgba(0,0,0,0.2)] rounded">
                            <label class="text-xs muted mb-2 block font-bold">Next Blinds</label>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="text-xs muted mb-1 block">SB</label>

                        <div class="flex items-center gap-2">
                            <input type="number" id="chipRatioInput" min="1" step="1" value="1" class="w-28 px-2 py-2 border rounded text-sm">

    <script>
        // 全局变量
        let currentUser = null;
        let websocket = null;
        let trendsChart = null;
        let originalScores = [];
        // stack of snapshots before each rebalance; pop to undo latest
        let rebalanceStack = [];

        let selectedTargetUser = null;
        let currentChipRatio = 1;
        let leaderboardDisplayMode = 'amount';
        let currentBuyinMode = 'amount';
        let currentSetCurrentMode = 'amount';

        function formatNumber(value) {
            const num = Number(value || 0);
            if (!Number.isFinite(num)) return '0.00';
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(num);
        }

        function formatDisplayValue(value, mode = leaderboardDisplayMode) {
            const num = Number(value || 0);
            if (!Number.isFinite(num)) return '0.00';
            if (mode === 'chips') {
                return formatNumber(num * currentChipRatio);
            }
            return formatNumber(num);
        }

        function setLeaderboardNumber(element, value) {
            const formatted = formatDisplayValue(value);
            const decimalIndex = formatted.lastIndexOf('.');
            element.replaceChildren(document.createTextNode(formatted.slice(0, decimalIndex)));
            const decimal = document.createElement('span');
            decimal.className = 'leaderboard-decimal';
            decimal.textContent = formatted.slice(decimalIndex);
            element.appendChild(decimal);
        }

        function getModeValue(rawValue, mode) {
            const num = Number(rawValue || 0);
            if (!Number.isFinite(num)) return 0;
            return mode === 'chips' ? (num / currentChipRatio) : num;
        }

        function syncSegmentedButtons(container, activeKey) {
            if (!container) return;
            const buttons = container.querySelectorAll('button[data-mode]');
            buttons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === activeKey);
            });
        }

        function syncLeaderboardModeButtons() {
            const container = document.getElementById('leaderboardDisplayMode');
            if (!container) return;
            const active = leaderboardDisplayMode === 'chips' ? 'chips' : 'amount';
            container.querySelectorAll('button[data-display]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.display === active);
            });
        }

        function bindModeButtons() {
            document.querySelectorAll('.segmented button[data-mode]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.mode;
                    if (mode === 'amount' || mode === 'chips') {
                        currentBuyinMode = mode;
                        setPointsModePlaceholders();
                        syncSegmentedButtons(btn.closest('.segmented'), mode);
                        return;
                    }
                    if (mode === 'set-current-amount' || mode === 'set-current-chips') {
                        currentSetCurrentMode = mode.endsWith('chips') ? 'chips' : 'amount';
                        setPointsModePlaceholders();
                        syncSegmentedButtons(btn.closest('.segmented'), mode);
                    }
                });
            });

            document.querySelectorAll('#leaderboardDisplayMode button[data-display]').forEach(btn => {
                btn.addEventListener('click', () => {
                    leaderboardDisplayMode = btn.dataset.display === 'chips' ? 'chips' : 'amount';
                    syncLeaderboardModeButtons();
                    loadLeaderboard();
                });
            });
        }

        function setPointsModePlaceholders() {
            const pointsInput = document.getElementById('pointsAmount');
            const setInput = document.getElementById('setCurrentAmount');
            if (pointsInput) pointsInput.placeholder = currentBuyinMode === 'chips' ? '筹码' : '金额';
            if (setInput) setInput.placeholder = currentSetCurrentMode === 'chips' ? '筹码' : '金额';
            formatNumericInput(pointsInput, currentBuyinMode === 'amount');
            formatNumericInput(setInput, currentSetCurrentMode === 'amount');
        }

        function parseNumericInput(input) {
            const value = String(input?.value || '').replace(/,/g, '').trim();
            return value === '' ? NaN : Number(value);
        }

        function formatNumericInput(input, enabled = true) {
            if (!input) return;
            const oldValue = input.value;
            const caret = input.selectionStart ?? oldValue.length;
            const digitsBeforeCaret = (oldValue.slice(0, caret).match(/[0-9]/g) || []).length;
            let normalized = oldValue.replace(/,/g, '').replace(/[^0-9.]/g, '');
            const decimalIndex = normalized.indexOf('.');
            if (decimalIndex !== -1) {
                normalized = normalized.slice(0, decimalIndex + 1) + normalized.slice(decimalIndex + 1).replace(/\./g, '');
            }
            if (enabled && normalized) {
                const parts = normalized.split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                normalized = parts.join('.');
            }
            input.value = normalized;
            let newCaret = 0;
            let digitsSeen = 0;
            while (newCaret < normalized.length && digitsSeen < digitsBeforeCaret) {
                if (/\d/.test(normalized[newCaret])) digitsSeen++;
                newCaret++;
            }
            if (digitsSeen === digitsBeforeCaret) {
                while (newCaret < normalized.length && normalized[newCaret] === ',') newCaret++;
            }
            input.setSelectionRange(newCaret, newCaret);
        }

        function bindNumericInputFormatting() {
            const points = document.getElementById('pointsAmount');
            const setCurrent = document.getElementById('setCurrentAmount');
            const winLoss = document.getElementById('wlAmount');
            points?.addEventListener('input', () => formatNumericInput(points, currentBuyinMode === 'amount'));
            setCurrent?.addEventListener('input', () => formatNumericInput(setCurrent, currentSetCurrentMode === 'amount'));
            winLoss?.addEventListener('input', () => formatNumericInput(winLoss, true));
        }

        function addActivityLog(message) {
            const log = document.getElementById('activityLog');
            if (!log) return;
            const row = document.createElement('div');
            row.className = 'mb-1';
            row.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(row);
            log.scrollTop = log.scrollHeight;
        }

        async function loadBuyinLogs() {
            const list = document.getElementById('buyinLogList');
            if (!list) return;
            try {
                const response = await fetch('/api/buyin_logs');
                const data = await response.json();
                list.innerHTML = '';
                if (!(data.logs || []).length) {
                    const empty = document.createElement('div');
                    empty.className = 'muted text-xs py-3 text-center';
                    empty.textContent = '暂无 Buy-in 记录';
                    list.appendChild(empty);
                    return;
                }
                data.logs.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'glass-panel rounded-lg px-3 py-2 flex items-center justify-between gap-3 text-xs';
                    const details = document.createElement('div');
                    details.className = 'min-w-0';
                    const who = document.createElement('div');
                    who.className = 'font-semibold truncate';
                    who.textContent = item.username;
                    const when = document.createElement('div');
                    when.className = 'muted mt-1';
                    when.textContent = item.created_at || '';
                    details.append(who, when);
                    const values = document.createElement('div');
                    values.className = 'text-right shrink-0';
                    const cash = document.createElement('div');
                    cash.className = 'font-bold';
                    cash.textContent = `¥${formatNumber(item.amount)}`;
                    const chips = document.createElement('div');
                    chips.className = 'muted mt-1';
                    chips.textContent = `${formatNumber(item.chips)} 筹码 · 比例 ${formatNumber(item.ratio)}`;
                    values.append(cash, chips);
                    row.append(details, values);
                    list.appendChild(row);
                });
            } catch (error) {
                console.error('加载 Buy-in 日志失败', error);
            }
        }

        async function loadChipRatio() {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();
                currentChipRatio = Number(data.chip_ratio) > 0 ? Number(data.chip_ratio) : 1;
                const status = document.getElementById('statusChipRatioLabel');
                const adminValue = document.getElementById('adminChipRatioValue');
                const input = document.getElementById('chipRatioInput');
                if (status) status.textContent = formatNumber(currentChipRatio);
                if (adminValue) adminValue.textContent = formatNumber(currentChipRatio);
                if (input) input.value = String(currentChipRatio);
                loadLeaderboard();
            } catch (error) {
                console.error('读取筹码比例失败', error);
            }
        }

        async function updateChipRatio() {
            if (!currentUser) return;
            const ratio = Number(document.getElementById('chipRatioInput').value);
            if (!Number.isFinite(ratio) || ratio <= 0) {
                alert('筹码比例必须大于 0');
                return;
            }
            const response = await fetch('/api/settings', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_user: currentUser.username, chip_ratio: ratio })
            });
            const data = await response.json();
            if (!data.success) { alert(data.message || '保存失败'); return; }
            currentChipRatio = ratio;
            document.getElementById('adminChipRatioValue').textContent = formatNumber(ratio);
            document.getElementById('statusChipRatioLabel').textContent = formatNumber(ratio);
            loadLeaderboard();
            addActivityLog(`筹码比例已更新为 ${formatNumber(ratio)}`);
        }

        async function loadOnlineUsers() {
            try {
                const response = await fetch('/api/users');
                const data = await response.json();
                const container = document.getElementById('onlineUsers');
                if (!container) return;
                container.innerHTML = '';
                (data.users || []).forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'online-card glass-panel rounded-xl p-3 text-center';
                    const avatar = document.createElement('div');
                    avatar.className = 'text-3xl mb-1';
                    avatar.textContent = user.avatar && !user.avatar.includes('.') ? user.avatar : '🙂';
                    const name = document.createElement('div');
                    name.className = 'text-xs truncate';
                    name.textContent = user.username;
                    card.append(avatar, name);
                    container.appendChild(card);
                });
            } catch (error) { console.error('加载用户失败', error); }
        }

        async function loadUsersForPoints() {
            try {
                const response = await fetch('/api/users');
                const data = await response.json();
                const actor = document.getElementById('pointsUserButtons');
                const targets = document.getElementById('targetUserButtons');
                actor.innerHTML = '';
                targets.innerHTML = '';
                const badge = document.createElement('span');
                badge.className = 'px-3 py-2 rounded-lg glass-panel';
                badge.textContent = currentUser ? currentUser.username : '未登录';
                actor.appendChild(badge);
                (data.users || []).filter(user => user.username !== (currentUser && currentUser.username)).forEach(user => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'px-3 py-2 rounded-lg glass-panel text-xs';
                    button.textContent = user.username;
                    button.onclick = () => {
                        selectedTargetUser = user.username;
                        targets.querySelectorAll('button').forEach(el => el.classList.remove('active'));
                        button.classList.add('active');
                    };
                    targets.appendChild(button);
                });
            } catch (error) { console.error('加载记分用户失败', error); }
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/scores');
                const data = await response.json();
                const body = document.querySelector('#leaderboardTable tbody');
                if (!body) return;
                body.innerHTML = '';
                const sums = { brought: 0, current: 0, win_loss: 0 };
                (data.scores || []).forEach(score => {
                    sums.brought += Number(score.brought || 0);
                    sums.current += Number(score.current || 0);
                    sums.win_loss += Number(score.win_loss || 0);
                    const row = document.createElement('tr');
                    row.innerHTML = `<td></td><td></td><td></td><td></td><td></td>`;
                    row.cells[0].textContent = score.player;
                    setLeaderboardNumber(row.cells[1], score.brought);
                    setLeaderboardNumber(row.cells[2], score.current);
                    setLeaderboardNumber(row.cells[3], score.win_loss);
                    row.cells[3].className = Number(score.win_loss) >= 0 ? 'text-green-400' : 'text-red-400';
                    setLeaderboardNumber(row.cells[4], score.win_loss);
                    row.cells[4].className = row.cells[3].className;
                    body.appendChild(row);
                });
                setLeaderboardNumber(document.getElementById('totalBuyin'), sums.brought);
                setLeaderboardNumber(document.getElementById('totalCurrent'), sums.current);
                setLeaderboardNumber(document.getElementById('totalWinLossValue'), sums.win_loss);
                setLeaderboardNumber(document.getElementById('totalFinalValue'), sums.win_loss);
                const label = document.getElementById('totalWinLoss');
                if (label) {
                    label.replaceChildren(document.createTextNode('总赢亏：'));
                    const number = document.createElement('span');
                    setLeaderboardNumber(number, data.total_win_loss || 0);
                    label.append(number, document.createTextNode(leaderboardDisplayMode === 'chips' ? ' 筹码' : ' 金额'));
                }
            } catch (error) { console.error('加载排行榜失败', error); }
        }

        async function performPointsAction(action, isSetCurrent = false) {
            if (!currentUser) { alert('请先登录'); return; }
            const input = (action === 'set_current' || isSetCurrent) ? document.getElementById('setCurrentAmount') : document.getElementById('pointsAmount');
            const amount = parseNumericInput(input);
            const mode = (action === 'set_current' || isSetCurrent) ? currentSetCurrentMode : currentBuyinMode;
            if (!Number.isFinite(amount) || amount < 0) { alert('请输入有效金额'); return; }
            const response = await fetch('/api/update_score', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, action, amount, mode })
            });
            const data = await response.json();
            if (!data.success) { alert(data.message || '操作失败'); return; }
            input.value = '';
            input.dispatchEvent(new Event('input', { bubbles: true }));
            addActivityLog(`${currentUser.username} ${action} ${formatNumber(amount)} ${mode === 'chips' ? '筹码' : '金额'}`);
            loadLeaderboard();
            loadBuyinLogs();
        }

        async function performWinLoss(action) {
            if (!currentUser || !selectedTargetUser) { alert('请选择目标用户'); return; }
            const amount = parseNumericInput(document.getElementById('wlAmount'));
            if (!Number.isFinite(amount) || amount <= 0) { alert('请输入有效金额'); return; }
            const response = await fetch('/api/update_score', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, action, amount, target_user: selectedTargetUser })
            });
            const data = await response.json();
            if (!data.success) { alert(data.message || '操作失败'); return; }
            document.getElementById('wlAmount').value = '';
            loadLeaderboard();
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.querySelectorAll('nav .tab-btn').forEach(button => button.classList.remove('active'));
            const target = document.getElementById(`${name}Tab`);
            if (target) target.classList.remove('hidden');
            const activeButton = Array.from(document.querySelectorAll('nav .tab-btn')).find(button => button.getAttribute('onclick') === `switchTab('${name}')`);
            if (activeButton) activeButton.classList.add('active');
            if (name === 'status') { loadOnlineUsers(); loadBuyinLogs(); }
            if (name === 'points') loadUsersForPoints();
            if (name === 'leaderboard') loadLeaderboard();
            if (name === 'admin') loadChipRatio();
        }

        function loadAllData() {
            loadOnlineUsers();
            loadUsersForPoints();
            loadLeaderboard();
            loadBuyinLogs();
            loadChipRatio();
        }

        function initWebSocket() {
            if (!currentUser || !window.WebSocket) return;
            if (websocket) websocket.close();
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            websocket = new WebSocket(`${protocol}//${window.location.host}/ws/${encodeURIComponent(currentUser.username)}`);
            websocket.onmessage = event => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'score_update') { loadLeaderboard(); loadBuyinLogs(); }
                    if (message.type === 'settings_changed') {
                        currentChipRatio = Number(message.chip_ratio) || 1;
                        loadChipRatio();
                    }
                    if (message.type === 'user_status') loadOnlineUsers();
                } catch (error) { console.error('处理实时更新失败', error); }
            };
        }

        function hydrateCurrentUserFromStorage() {
            try {
                const storedUser = localStorage.getItem('currentUser');
                if (!storedUser) return false;
                currentUser = JSON.parse(storedUser);
                if (!currentUser || !currentUser.username) {
                    localStorage.removeItem('currentUser');
                    return false;
                }
                return true;
            } catch (e) {
                localStorage.removeItem('currentUser');
                return false;
            }
        }

        function refreshAllData() {
            loadOnlineUsers();
            loadUsersForPoints();
            loadLeaderboard();
            loadTrends();
            refreshSeats();
            loadBuyinLogs();
            loadChipRatio();
            setPointsModePlaceholders();
            addActivityLog('已刷新所有数据');
        }

        function toggleAuthModal(mode) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authTitle = document.getElementById('authTitle');
            const isRegister = mode === 'register';

            if (loginForm) loginForm.classList.toggle('hidden', isRegister);
            if (registerForm) registerForm.classList.toggle('hidden', !isRegister);
            if (authTitle) authTitle.textContent = isRegister ? '注册' : '登录';

            if (isRegister) {
                loadAvatarPicker();
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            if (!username) {
                alert('请输入用户名');
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}`
                });
                const data = await response.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));

                    document.getElementById('authModal').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    document.getElementById('currentUser').textContent = `当前用户: ${currentUser.username}`;

                    const av = document.getElementById('currentAvatar');
                    if (currentUser.avatar && currentUser.avatar.indexOf('.') > -1) {
                        av.innerHTML = `<img src="/static/${currentUser.avatar}" class="w-8 h-8 rounded-full object-cover"/>`;
                    } else {
                        av.textContent = currentUser.avatar || '';
                    }
                    document.getElementById('changeAvatarBtn').classList.remove('hidden');

                    if (currentUser.is_admin || currentUser.username.toLowerCase() === 'peng') {
                        document.getElementById('adminTabBtn').classList.remove('hidden');
                        document.getElementById('generateSeatsBtn').classList.remove('hidden');
                    }
                    if (currentUser.username.toLowerCase() === 'mj') {
                        document.getElementById('generateSeatsBtn').classList.remove('hidden');
                    }

                    initWebSocket();
                    loadAllData();
                } else {
                    alert(data.message || '登录失败');
                }
            } catch (error) {
                console.error('login failed', error);
                alert('登录失败，请稍后重试');
            }
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const avatar = document.getElementById('regAvatar').value;

            if (!username) {
                alert('请输入用户名');
                return;
            }
            if (!avatar || avatar === 'default_avatar.png') {
                alert('请选择一个头像');
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, avatar })
                });
                const data = await response.json();
                if (data.success) {
                    alert('注册成功，请登录');
                    toggleAuthModal('login');
                } else {
                    alert(data.message || '注册失败');
                }
            } catch (error) {
                console.error('register failed', error);
                alert('注册失败，请稍后重试');
            }
        }

        async function loadAvatarPicker() {
            try {
                const resp = await fetch('/api/avatars');
                const data = await resp.json();
                const picker = document.getElementById('avatarPicker');
                if (!picker) return;
                picker.innerHTML = '';
                const taken = new Set(data.taken || []);
                (data.all || []).forEach(emoji => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'w-10 h-10 text-2xl flex items-center justify-center rounded';
                    btn.textContent = emoji;
                    if (taken.has(emoji)) {
                        btn.classList.add('opacity-40', 'cursor-not-allowed');
                        btn.disabled = true;
                    }
                    btn.addEventListener('click', () => {
                        if (btn.disabled) return;
                        document.getElementById('regAvatar').value = emoji;
                        picker.querySelectorAll('button').forEach(b => b.classList.remove('ring', 'ring-2', 'ring-blue-400'));
                        btn.classList.add('ring', 'ring-2', 'ring-blue-400');
                    });
                    picker.appendChild(btn);
                });
            } catch (e) {
                console.error('加载头像列表失败', e);
            }
        }

        function logout() {
            if (websocket) {
                websocket.close();
            }
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authModal').classList.remove('hidden');
            toggleAuthModal('login');
        }

        document.addEventListener('DOMContentLoaded', () => {
            bindModeButtons();
            bindNumericInputFormatting();
            setPointsModePlaceholders();
            loadChipRatio();
            loadBuyinLogs();

            const storedUser = hydrateCurrentUserFromStorage();
            if (storedUser) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('currentUser').textContent = `当前用户: ${currentUser.username}`;
                const av = document.getElementById('currentAvatar');
                if (currentUser.avatar && currentUser.avatar.indexOf('.') > -1) {
                    av.innerHTML = `<img src="/static/${currentUser.avatar}" class="w-8 h-8 rounded-full object-cover"/>`;
                } else {
                    av.textContent = currentUser.avatar || '';
                }
                document.getElementById('changeAvatarBtn').classList.remove('hidden');
                if (currentUser.is_admin || currentUser.username.toLowerCase() === 'peng') {
                    document.getElementById('adminTabBtn').classList.remove('hidden');
                    document.getElementById('generateSeatsBtn').classList.remove('hidden');
                }
                if (currentUser.username.toLowerCase() === 'mj') {
                    document.getElementById('generateSeatsBtn').classList.remove('hidden');
                }
                initWebSocket();
                loadAllData();
                return;
            }

            toggleAuthModal('login');
        });
    </script>
</body>
</html>
